<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DD</title><style>:root{--az:#4a6b8c;--bg:#f3f5f8;--borda:#d1d5db;--verde:#2e7d32;--vermelho:#d32f2f}*{box-sizing:border-box;font-family:sans-serif}body{margin:0;background:var(--bg);display:flex;justify-content:center;min-height:100vh}#app{width:100%;max-width:600px;padding:16px}header{margin-bottom:24px}.btn-voltar{background:#9ab0b6;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;display:none;cursor:pointer;width:fit-content;margin-bottom:16px}h1{font-family:serif;font-size:32px;margin:0}.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:16px}.card h2{font-size:18px;margin:0 0 16px}.radio-group{display:flex;flex-direction:column;gap:12px}.radio-label{display:flex;gap:10px;font-size:16px}.radio-label input{width:20px;height:20px}.mode-btn{display:flex;gap:12px;cursor:pointer;align-items:flex-start}.mode-btn:hover{border-color:#2196f3}.mode-icon{font-size:24px}.mode-text h3{margin:0 0 4px;font-size:18px}.mode-text p{margin:0;font-size:14px;color:#666}#quiz-screen{display:none}.q-container{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:16px}.q-title{font-weight:bold;margin-bottom:12px;color:var(--az)}.q-text{font-size:16px;margin-bottom:16px;white-space:pre-wrap}.alt{border:2px solid var(--borda);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;font-size:15px}.alt:hover:not(.locked){background:#f9f9f9}.alt.sel{border-color:#2196f3;background:#e3f2fd}.alt.correct{border-color:var(--verde);background:#e8f5e9}.alt.wrong{border-color:var(--vermelho);background:#ffebee}.alt.locked{cursor:default}.btn-verify{display:block;width:100%;padding:14px;background:#2196f3;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}.btn-verify:hover:not(:disabled){background:#1976d2}.btn-verify:disabled{background:#cfd8dc;color:#78909c;cursor:not-allowed}.btn-verify.checked{background:#e0e0e0;color:#757575}.feedback{margin-top:16px;padding:16px;border-radius:8px;font-size:14px;display:none}.feedback.show{display:block}.feedback.ok{background:#e8f5e9;border-left:4px solid var(--verde)}.feedback.no{background:#ffebee;border-left:4px solid var(--vermelho)}.feedback b{display:block;margin-bottom:6px}.fb-alt{margin-top:8px;padding-top:8px;border-top:1px solid #ccc;font-size:13px}.nav-btns{display:flex;justify-content:space-between;margin-top:24px}.nav-btns button{padding:12px 24px;border-radius:8px;border:none;background:#9ab0b6;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}.nav-btns button:disabled{opacity:.5}.nav-btns button.primary{background:var(--az)}</style></head><body><div id="app"><header><a href="#" class="btn-voltar" id="btn-voltar" onclick="voltarInicio(event)">← Voltar</a><h1>DD</h1></header><div id="start-screen"><div class="card"><h2>Ordem das questões</h2><div class="radio-group"><label class="radio-label"><input type="radio" name="ordem" value="seq" checked> Sequencial</label><label class="radio-label"><input type="radio" name="ordem" value="rand"> Aleatória</label></div></div><div class="card mode-btn" onclick="iniciar('uma')"><div class="mode-icon">1️⃣</div><div class="mode-text"><h3>Uma por uma</h3><p>Responder uma de cada vez.</p></div></div><div class="card mode-btn" onclick="iniciar('todas')"><div class="mode-icon">📋</div><div class="mode-text"><h3>Todas as questões</h3><p>Mostrar na mesma página.</p></div></div></div><div id="quiz-screen"><div id="quiz-content"></div><div class="nav-btns" id="nav-controls" style="display:none;"><button id="btn-prev" onclick="mudarQ(-1)">← Anterior</button><button id="btn-next" class="primary" onclick="mudarQ(1)">Próxima →</button></div></div></div>
<script>
const DB=[
{id:1,en:"Durante a folga, um Soldado é preso em flagrante por crime comum por autoridade civil, que o mantém na cela comum por 3 dias. À luz da Lei 1.943/1954, a conduta foi:",a:[{t:"A) Correta, pois cessa a prerrogativa de recolhimento em Unidade Militar.",e:"Falso. A lei garante recolhimento em unidade militar."},{t:"B) Incorreta, pois a autoridade civil deve entregar o preso imediatamente à autoridade militar após o flagrante.",c:1},{t:"C) Correta, se a cela comum estiver separada de condenados.",e:"Falso. O dever é a entrega imediata."},{t:"D) Incorreta, pois militares só podem ser presos por crime militar.",e:"Falso. Podem ser presos por crime comum."}],j:"Art. 269, § 1º da Lei 1.943/54."},
{id:2,en:"O Cabo PM Silva, na ativa, constitui empresa de eletrônicos como sócio-administrador e presta segurança privada em supermercado. Conforme o Dec. 5.075/1998:",a:[{t:"A) As duas condutas são vedadas.",c:1},{t:"B) O comércio é permitido, mas segurança exige autorização.",e:"Falso. Comércio com gestão é vedado e segurança não tem autorização."},{t:"C) Ambas são permitidas fora do horário de serviço.",e:"Falso. O Art. 7º, § 3º veda ambas."},{t:"D) Segurança é permitida a praças estáveis.",e:"Falso. Vedada a todo militar."}],j:"Art. 7º, § 3º do Dec. 5.075/98."},
{id:3,en:"Nos termos do Art. 102 da Lei 1.943/1954, constituem deveres fundamentais do militar:",a:[{t:"A) Exercer comércio local e segurança privada.",e:"Falso. Atividades vedadas."},{t:"B) Acatar a autoridade civil e satisfazer compromissos pecuniários.",c:1},{t:"C) Manifestar-se sobre política partidária.",e:"Falso. Proibido."},{t:"D) Prestar depoimento só se remunerado.",e:"Falso. É dever funcional."}],j:"Art. 102, alíneas 'e' e 'f' da Lei 1.943/54."},
{id:4,en:"Sargento (14 anos) e Soldado (3 anos) praticam grave transgressão. Na hipótese de conflito entre ADL e Conselho de Disciplina (Lei 22.211/2024):",a:[{t:"A) Instaura-se ADL para ambos.",e:"Falso. ADL é para praças com menos de 10 anos."},{t:"B) Dois processos separados.",e:"Falso. Prevê unificação."},{t:"C) Instaura-se Conselho de Disciplina.",c:1},{t:"D) Suspende até completar 10 anos.",e:"Falso. Não existe essa regra."}],j:"Art. 4º, § 3º, I da Lei 16.544/10."},
{id:5,en:"Em FATD, o Oficial indefere pedido de provas protelatório. Após a decisão de indeferimento (Art. 12 da Portaria CG 339/2006):",a:[{t:"A) Vai direto para julgamento.",e:"Falso. O acusado é cientificado."},{t:"B) O acusado é cientificado e tem novo prazo de 3 dias úteis.",c:1},{t:"C) Perde direito às razões finais.",e:"Falso. Não há perda."},{t:"D) FATD é anulado e vira Sindicância.",e:"Falso. Prossegue."}],j:"Art. 12, § 1º da Portaria CG 339/06."},
{id:6,en:"A Sindicância na PMPR (Portaria CG 338/2006) em relação à natureza e prazo é:",a:[{t:"A) Processo judicial de 15 dias corridos.",e:"Falso. Não é judicial."},{t:"B) Instrumento administrativo inquisitorial de 20 dias úteis.",c:1},{t:"C) Procedimento punitivo de 30 dias.",e:"Falso. Não é punitivo."},{t:"D) Inquérito criminal de 10 dias.",e:"Falso. Não é criminal."}],j:"Arts. 1º e 13 da Portaria CG 338/06."},
{id:7,en:"O Inquérito Técnico (IT) da PMPR (Portaria CG 883/2022) tem por finalidade precípua:",a:[{t:"A) Processar crimes militares.",e:"Falso. Não processa."},{t:"B) Apurar evento danoso a bem patrimonial permanente.",c:1},{t:"C) Apurar transgressões leves.",e:"Falso. Não é o objeto."},{t:"D) Apurar desvios éticos de folga.",e:"Falso. Não é o foco."}],j:"Art. 1º da Portaria CG 883/22."},
{id:8,en:"Policial efetua disparo letal, causando lesão corporal na perna, sem crime militar. Conforme a Portaria CG 289/2026 (Art. 6º), a apuração será por:",a:[{t:"A) IT.",e:"Falso. IT apura patrimônio."},{t:"B) FATD.",e:"Falso. Apura transgressão."},{t:"C) Sindicância.",c:1},{t:"D) Conselho de Disciplina.",e:"Falso. Hipóteses específicas."}],j:"Art. 6º, § 4º da Portaria CG 289/26."},
{id:9,en:"Sobre transgressão e esferas cível/criminal/administrativa no RDE (Dec. 4.346/2002):",a:[{t:"A) Conduta tipificada como crime não se caracteriza como transgressão.",c:1},{t:"B) Absolvição por insuficiência de provas arquiva o disciplinar.",e:"Falso. Esferas independentes."},{t:"C) Permite-se duas penalidades para uma transgressão.",e:"Falso. Vedado bis in idem."},{t:"D) Concurso de crime e transgressão exige duas punições.",e:"Falso. Crime afasta transgressão."}],j:"Art. 14, § 1º do RDE."},
{id:10,en:"Analise: O militar ativo da PMPR pode exercer livremente o comércio e ser sócio-administrador em suas folgas.",a:[{t:"V) Verdadeiro",e:"Falso. Art. 107 da Lei 1.943 e Art. 7º do Dec. 5.075 vedam."},{t:"F) Falso",c:1}],j:"Gerência de firma comercial é vedada."},
{id:11,en:"Analise: O Sentimento do Dever Militar implica reconhecer a obrigatoriedade de um comportamento militar coerente e justo.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. É a definição do Art. 4º, § 2º do Dec. 5.075."}],j:"Art. 4º, § 2º do Anexo do Dec. 5.075/98."},
{id:12,en:"Analise: Ao militar portador de diploma liberal é permitido desenvolver a prática no meio civil, se não prejudicar o serviço.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Permitido pelo Art. 107, § 2º da Lei 1.943."}],j:"Art. 107, § 2º da Lei 1.943/54."},
{id:13,en:"Analise: A responsabilidade por violação ética de mais de um militar é individual, sem solidariedade.",a:[{t:"V) Verdadeiro",e:"Falso. A responsabilidade é solidária."},{t:"F) Falso",c:1}],j:"Art. 8º, § 5º do Dec. 5.075/98."},
{id:14,en:"Analise: É assegurado ao militar inativo participar de atividades político-partidárias, exceto assuntos militares sigilosos.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Assegurado pelo Art. 7º, § 6º do Dec. 5.075."}],j:"Art. 7º, § 6º do Anexo do Dec. 5.075/98."},
{id:15,en:"Analise: A advertência é admoestação verbal que deve constar nas alterações do punido e ser publicada.",a:[{t:"V) Verdadeiro",e:"Falso. Não consta nas alterações."},{t:"F) Falso",c:1}],j:"Art. 25, § 2º do RDE."},
{id:16,en:"Analise: Para classificação de comportamento, a advertência e o impedimento não geram rebaixamento.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Segue o Art. 51, § 5º do RDE."}],j:"Art. 51, § 5º do RDE."},
{id:17,en:"Analise: As praças da PMPR têm direito a uniformes de posse obrigatória por conta do Estado.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Direito garantido pelo Art. 216 da Lei 1.943."}],j:"Art. 216 da Lei 1.943/54."},
{id:18,en:"Analise: O Regulamento de Ética permite invocar ordens superiores para justificar tortura.",a:[{t:"V) Verdadeiro",e:"Falso. Proibido expressamente."},{t:"F) Falso",c:1}],j:"Art. 13 do Dec. 5.075/98."},
{id:19,en:"Analise: A violação ética é tanto mais grave quanto mais elevado for o grau hierárquico.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. É o texto literal do Art. 8º do Dec. 5.075."}],j:"Art. 8º, § 2º do Anexo do Dec. 5.075/98."}
];
let lQ=[],vM='',cI=0,r={},v={};
function iniciar(m){vM=m;const rnd=document.querySelector('input[name="ordem"]:checked').value==='rand';lQ=[...DB];if(rnd)lQ.sort(()=>Math.random()-.5);cI=0;r={};v={};document.getElementById('start-screen').style.display='none';document.getElementById('quiz-screen').style.display='block';document.getElementById('btn-voltar').style.display='inline-block';if(vM==='uma'){document.getElementById('nav-controls').style.display='flex';renderU()}else{document.getElementById('nav-controls').style.display='none';renderT()}}
function voltarInicio(e){if(e)e.preventDefault();document.getElementById('start-screen').style.display='block';document.getElementById('quiz-screen').style.display='none';document.getElementById('btn-voltar').style.display='none'}
function renderT(){const b=document.getElementById('quiz-content');b.innerHTML='';lQ.forEach((q,i)=>b.innerHTML+=`<div id="c-${q.id}">${getC(q,i)}</div>`)}
function renderU(){const b=document.getElementById('quiz-content');const q=lQ[cI];b.innerHTML=`<div id="c-${q.id}">${getC(q,cI)}</div>`;document.getElementById('btn-prev').disabled=cI===0;const bn=document.getElementById('btn-next');if(cI===lQ.length-1){bn.textContent="Finalizar";bn.onclick=()=>{alert("Simulado concluído!");voltarInicio()}}else{bn.textContent="Próxima →";bn.onclick=()=>{cI++;renderU();window.scrollTo(0,0)}}}
function upC(i){const q=lQ[i];const el=document.getElementById(`c-${q.id}`);if(el)el.innerHTML=getC(q,i)}
function getC(q,i){let h=`<div class="q-container"><div class="q-title">Questão ${q.id}</div><div class="q-text">${q.en}</div>`;const rs=r[q.id],ver=v[q.id]===true;q.a.forEach((alt,j)=>{let cls='alt';if(ver)cls+=' locked';if(ver){if(alt.c)cls+=' correct';else if(rs===j)cls+=' wrong'}else{if(rs===j)cls+=' sel'}h+=`<div class="${cls}" onclick="sel(${i},${j})">${alt.t}</div>`});if(!ver){h+=`<button class="btn-verify" ${rs!==undefined?'':'disabled'} onclick="verificar(${i})">Verificar Resposta</button>`}else{h+=`<button class="btn-verify checked" disabled>Resposta Verificada</button>`;h+=`<div class="feedback show ${q.a[rs].c?'ok':'no'}"><b>${q.a[rs].c?'✅ Você acertou!':'❌ Você errou.'}</b><div style="margin-bottom:8px"><strong>Justificativa:</strong> ${q.j}</div>`;q.a.forEach(alt=>{if(!alt.c&&alt.e)h+=`<div class="fb-alt"><em>Por que está errada:</em> <span>${alt.e}</span></div>`});h+=`</div>`}h+=`</div>`;return h}
function sel(i,j){const q=lQ[i];if(v[q.id])return;r[q.id]=j;upC(i)}
function verificar(i){const q=lQ[i];v[q.id]=true;upC(i)}
</script>
</body>
</html>
