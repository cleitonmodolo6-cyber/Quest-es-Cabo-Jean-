<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DD - Simulado</title>
<style>
:root{--az:#4a6b8c;--bg:#f3f5f8;--borda:#d1d5db;--verde:#2e7d32;--vermelho:#d32f2f}
*{box-sizing:border-box;font-family:sans-serif}
body{margin:0;background:var(--bg);display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:600px;padding:16px}
header{margin-bottom:24px}
.btn-voltar{background:#9ab0b6;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;display:none;cursor:pointer;width:fit-content;margin-bottom:16px}
h1{font-family:serif;font-size:32px;margin:0}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font-size:18px;margin:0 0 16px}
.radio-group{display:flex;flex-direction:column;gap:12px}
.radio-label{display:flex;gap:10px;font-size:16px}
.radio-label input{width:20px;height:20px}
.mode-btn{display:flex;gap:12px;cursor:pointer;align-items:flex-start}
.mode-btn:hover{border-color:#2196f3}
.mode-icon{font-size:24px}
.mode-text h3{margin:0 0 4px;font-size:18px}
.mode-text p{margin:0;font-size:14px;color:#666}
#quiz-screen{display:none}
.q-container{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:20px;margin-bottom:16px}
.q-title{font-weight:bold;margin-bottom:12px;color:var(--az)}
.q-text{font-size:16px;margin-bottom:16px;white-space:pre-wrap;line-height:1.4}
.alt{border:2px solid var(--borda);border-radius:8px;padding:12px;margin-bottom:10px;cursor:pointer;font-size:15px;line-height:1.4}
.alt:hover:not(.locked){background:#f9f9f9}
.alt.sel{border-color:#2196f3;background:#e3f2fd}
.alt.correct{border-color:var(--verde);background:#e8f5e9}
.alt.wrong{border-color:var(--vermelho);background:#ffebee}
.alt.locked{cursor:default}
.btn-verify{display:block;width:100%;padding:14px;background:#2196f3;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}
.btn-verify:hover:not(:disabled){background:#1976d2}
.btn-verify:disabled{background:#cfd8dc;color:#78909c;cursor:not-allowed}
.btn-verify.checked{background:#e0e0e0;color:#757575}
.feedback{margin-top:16px;padding:16px;border-radius:8px;font-size:14px;display:none;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:#e8f5e9;border-left:4px solid var(--verde)}
.feedback.no{background:#ffebee;border-left:4px solid var(--vermelho)}
.feedback b{display:block;margin-bottom:6px}
.fb-alt{margin-top:8px;padding-top:8px;border-top:1px solid #ccc;font-size:13px}
.nav-btns{display:flex;justify-content:space-between;margin-top:24px}
.nav-btns button{padding:12px 24px;border-radius:8px;border:none;background:#9ab0b6;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
.nav-btns button:disabled{opacity:.5}
.nav-btns button.primary{background:var(--az)}
</style>
</head>
<body>
<div id="app">
<header><a href="#" class="btn-voltar" id="btn-voltar" onclick="voltarInicio(event)">← Voltar</a><h1>DD</h1></header>
<div id="start-screen">
<div class="card"><h2>Ordem das questões</h2><div class="radio-group"><label class="radio-label"><input type="radio" name="ordem" value="seq" checked> Sequencial — ordem original</label><label class="radio-label"><input type="radio" name="ordem" value="rand"> Aleatória — embaralhar a cada início</label></div></div>
<div class="card mode-btn" onclick="iniciar('uma')"><div class="mode-icon">1️⃣</div><div class="mode-text"><h3>Uma por uma</h3><p>Responder uma questão de cada vez.</p></div></div>
<div class="card mode-btn" onclick="iniciar('todas')"><div class="mode-icon">📋</div><div class="mode-text"><h3>Todas as questões</h3><p>Mostrar todas na mesma página.</p></div></div>
</div>
<div id="quiz-screen"><div id="quiz-content"></div><div class="nav-btns" id="nav-controls" style="display:none;"><button id="btn-prev" onclick="mudarQ(-1)">← Anterior</button><button id="btn-next" class="primary" onclick="mudarQ(1)">Próxima →</button></div></div>
</div>
<script>
const DB=[
{id:1,en:"Situação Hipotética: Durante o período de folga, um Soldado da PMPR se envolve em uma discussão no trânsito e é preso em flagrante delito por uma autoridade policial civil por suposta prática de crime comum. A autoridade civil lavra o auto de prisão em flagrante e decide manter o militar recolhido na cela comum da delegacia civil por 3 dias para interrogatórios complementares. À luz da Lei Estadual nº 1.943/1954 (Código da PMPR), a conduta da autoridade civil quanto à custódia do militar foi:",a:[{t:"A) Correta, pois em crimes comuns cometidos durante a folga cessa a prerrogativa de recolhimento em Unidade Militar.",e:"Falso. A prerrogativa de recolhimento em unidade militar não cessa."},{t:"B) Incorreta, pois, efetuada a prisão, a autoridade policial civil deve fazer a entrega do preso imediatamente à autoridade militar após a lavratura do flagrante.",c:1},{t:"C) Correta, desde que a cela comum esteja separada de presos já condenados por sentença transitada em julgado.",e:"Falso. O dever legal é a entrega imediata."},{t:"D) Incorreta, pois militares estaduais somente podem ser presos em flagrante delito se a infração for estritamente um crime militar.",e:"Falso. Podem ser presos por crime comum."}],j:"O Art. 269, § 1º da Lei nº 1.943/1954 estabelece que, em caso de prisão em flagrante delito por autoridade policial civil, efetuada a prisão e lavrado o flagrante, a autoridade policial fará a entrega do preso imediatamente à autoridade militar."},
{id:2,en:"Situação Hipotética: O Cabo PM Silva, em pleno serviço ativo da PMPR, decide constituir uma empresa de comércio de equipamentos eletrônicos para funcionar em seus dias de folga, registrando-se como sócio-administrador na Junta Comercial. Além disso, passa a prestar serviços remunerados de segurança orgânica para um grande supermercado local. Conforme o Regulamento de Ética Profissional dos Militares Estaduais (Decreto nº 5.075/1998):",a:[{t:"A) As duas condutas do militar são vedadas pelo regulamento ético da corporação.",c:1},{t:"B) O comércio é permitido nas folgas, mas a segurança privada exige autorização do Comandante- Geral.",e:"Falso. Comércio com gestão é vedado e segurança privada é vedada."},{t:"C) Ambas as atividades são permitidas, desde que não coincidam com os turnos de serviço na PMPR.",e:"Falso. Vedadas independentemente do horário."},{t:"D) A segurança privada é permitida a praças estáveis, sendo vedada apenas a participação comercial.",e:"Falso. Vedada a todo militar da ativa."}],j:"O Art. 7º, § 3º do Decreto nº 5.075/1998 veda expressamente ao militar estadual da ativa exercer atividade de segurança privada, bem como fazer parte de firmas comerciais ou nelas exercer função ou emprego remunerado (permitindo-se apenas a condição de acionista ou quotista sem função de gestão/administração)."},
{id:3,en:"Nos termos do Art. 102 da Lei Estadual nº 1.943/1954, constituem deveres fundamentais do militar estadual, entre outros:",a:[{t:"A) Exercer com dedicação o comércio local nos períodos de licença e atuar em segurança privada nas folgas.",e:"Falso. Atividades vedadas."},{t:"B) Acatar a autoridade civil e satisfazer, com pontualidade, os compromissos pecuniários assumidos.",c:1},{t:"C) Manifestar-se publicamente sobre assuntos de política partidária mediante postagens institucionais.",e:"Falso. Proibido."},{t:"D) Prestar depoimento em processos disciplinares apenas quando devidamente remunerado por diárias.",e:"Falso. É dever funcional."}],j:"O Art. 102, alíneas 'e' e 'f' da Lei nº 1.943/1954 estabelece expressamente que é dever do militar acatar a autoridade civil, bem como satisfazer, com pontualidade, os compromissos pecuniários assumidos e garantir a assistência moral e material de seu lar."},
{id:4,en:"Situação Hipotética: Um Sargento com 14 anos de serviço e um Soldado com 3 anos de serviço praticam juntos uma grave transgressão disciplinar que afeta o decoro da classe. Diante do concurso de agentes entre praças com tempos de serviço distintos, a autoridade instauradora tem dúvidas sobre qual procedimento unificado instaurar. Com a redação da Lei nº 16.544/2010 (dada pela Lei nº 22.211/2024), na hipótese de conflito entre a Apuração Disciplinar de Licenciamento (ADL) e o Conselho de Disciplina:",a:[{t:"A) Deverá ser instaurada Apuração Disciplinar de Licenciamento (ADL) para ambos os envolvidos.",e:"Falso. A ADL é para praças com menos de 10 anos."},{t:"B) Deverão ser instaurados obrigatoriamente dois processos separados e sem qualquer conexão.",e:"Falso. A lei prevê unificação."},{t:"C) Havendo conflito entre Apuração Disciplinar de Licenciamento e Conselho de Disciplina, será instaurado Conselho de Disciplina.",c:1},{t:"D) O processo disciplinar deverá ser suspenso até que a praça mais nova complete 10 anos de serviço.",e:"Falso. Não existe essa regra."}],j:"Conforme o Art. 4º, § 3º, inciso I da Lei Estadual nº 16.544/2010 (incluído pela Lei nº 22.211/2024), havendo conflito entre Apuração Disciplinar de Licenciamento e Conselho de Disciplina, será instaurado Conselho de Disciplina."},
{id:5,en:"Situação Hipotética: Durante a instrução de um FATD na PMPR, o Oficial encarregado indefere fundamentadamente um pedido da defesa para inquirir 10 testemunhas irrelevantes, por considerar o pedido manifestamente protelatório. Nos termos do Art. 12 da Portaria CG nº 339/2006, após a decisão de indeferimento de provas:",a:[{t:"A) O processo vai direto para julgamento sem que o acusado possa se manifestar novamente.",e:"Falso. O acusado é cientificado."},{t:"B) O militar estadual acusado deverá ser cientificado da decisão, tendo então um novo prazo de 3 (três) dias úteis para defesa.",c:1},{t:"C) O acusado perde o direito de apresentar razões finais no processo.",e:"Falso. Não há perda."},{t:"D) O FATD é automaticamente anulado e convertido em Sindicância.",e:"Falso. Prossegue."}],j:"O Art. 12, § 1º da Portaria CG nº 339/2006 estabelece que o militar estadual apontado como autor do fato deverá ser cientificado da decisão que indeferir pedido de provas considerado protelatório, tendo então um novo prazo de 3 (três) dias úteis para defesa."},
{id:6,en:"A Portaria CG nº 338/2006 regula a elaboração de Sindicância na PMPR. Em relação à sua natureza e prazo de conclusão, assinale a alternativa correta:",a:[{t:"A) É um processo judicial acusatório com prazo de 15 dias corridos.",e:"Falso. Não é judicial."},{t:"B) É um instrumento administrativo de caráter inquisitorial cujo prazo de conclusão é de 20 dias úteis a contar da autuação.",c:1},{t:"C) É um procedimento disciplinar punitivo direto com prazo de 30 dias corridos.",e:"Falso. Não é punitivo."},{t:"D) É um inquérito criminal com prazo de 10 dias úteis improrrogáveis.",e:"Falso. Não é criminal."}],j:"O Art. 1º e o Art. 13 da Portaria CG nº 338/2006 definem a Sindicância como instrumento de natureza administrativa e caráter inquisitorial, com prazo de conclusão de 20 (vinte) dias úteis a contar da autuação (prorrogável por até 10 dias úteis)."},
{id:7,en:"A Portaria CG nº 883/2022 disciplina as normas do Inquérito Técnico (IT) no âmbito da PMPR. O Inquérito Técnico tem por finalidade precípua:",a:[{t:"A) Processar e julgar crimes militares cometidos por oficiais em serviço operacionais.",e:"Falso. Não processa."},{t:"B) Apurar evento danoso envolvendo bem patrimonial permanente sob administração militar, produzindo elementos informativos e esclarecendo circunstâncias.",c:1},{t:"C) Apurar transgressões disciplinares de natureza leve cometidas por praças sem estabilidade.",e:"Falso. Não é o foco."},{t:"D) Apurar especificamente desvios éticos em condutas particulares de policiais de folga.",e:"Falso. Não é o foco."}],j:"O Art. 1º da Portaria CG nº 883/2022 estabelece que o Inquérito Técnico (IT) é o instrumento administrativo de caráter inquisitorial que tem por finalidade apurar evento danoso envolvendo bem patrimonial permanente sob administração militar."},
{id:8,en:"Situação Hipotética: Durante um patrulhamento ostensivo, uma equipe da PMPR realiza abordagem a um suspeito armado. Diante de injusta agressão, um dos policiais efetua disparo de arma de fogo com munição letal, atingindo a perna do indivíduo e causando-lhe lesão corporal, sem que existam indícios de crime militar no contexto. Conforme o Art. 6º da Portaria CG nº 289/2026 (com redação dada pela Portaria CG nº 813/2026), a apuração do uso da força decorrente dessa lesão corporal por arma de fogo será feita por meio de:",a:[{t:"A) Inquérito Técnico (IT).",e:"Falso. Apura patrimônio."},{t:"B) Formulário de Apuração de Transgressão Disciplinar (FATD).",e:"Falso. Apura transgressão."},{t:"C) Sindicância.",c:1},{t:"D) Conselho de Disciplina.",e:"Falso. Hipóteses específicas."}],j:"Conforme o Art. 6º, § 4º da Portaria CG nº 289/2026 (inserido pela Portaria CG nº 813/2026), quando a ação de intervenção policial resultar em lesão corporal decorrente do emprego de arma de fogo com munição letal, deverá ser instaurada sindicância."},
{id:9,en:"O Regulamento Disciplinar do Exército (Decreto nº 4.346/2002 - RDE) estabelece regras sobre o conceito de transgressão e a relação entre as esferas cível, criminal e administrativa. Sobre o tema, é correto afirmar:",a:[{t:"A) Quando a conduta praticada estiver tipificada em lei como crime ou contravenção penal, não se caracterizará transgressão disciplinar.",c:1},{t:"B) A absolvição criminal por insuficiência de provas obriga o arquivamento automático do processo disciplinar.",e:"Falso. Esferas independentes."},{t:"C) É permitida a aplicação de duas penalidades disciplinares para uma única transgressão.",e:"Falso. Vedado bis in idem."},{t:"D) O concurso de crime e transgressão de mesma natureza exige duas punições administrativas somadas.",e:"Falso. Crime afasta transgressão."}],j:"O Art. 14, § 1º do RDE prescreve que, quando a conduta praticada estiver tipificada em lei como crime ou contravenção penal, não se caracterizará transgressão disciplinar."},
{id:10,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n1) ( ) O militar estadual do serviço ativo da PMPR pode exercer livremente o comércio e ser sócio-administrador de empresa comercial em seus horários de folga.",a:[{t:"V) Verdadeiro",e:"Falso. Vedado."},{t:"F) Falso",c:1}],j:"O Art. 107 da Lei nº 1.943/1954 e o Art. 7º, § 3º do Decreto nº 5.075/1998 vedam ao militar da ativa fazer parte de firma comercial ou exerça gerência/administração."},
{id:11,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n2) ( ) O Sentimento do Dever Militar consiste no envolvimento e na tomada de consciência perante o caso concreto, implicando o reconhecimento da obrigatoriedade de um comportamento militar coerente e justo.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Verdadeiro."}],j:"Definição exata contida no Art. 4º, § 2º do Anexo do Decreto nº 5.075/1998."},
{id:12,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n3) ( ) Ao militar estadual portador de diploma para o exercício de profissão liberal é permitido desenvolver a prática profissional no meio civil, desde que haja correlação com suas atividades na Corporação e não prejudique o serviço.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Permitido."}],j:"Conforme prevê expressamente o Art. 107, § 2º da Lei Estadual nº 1.943/1954."},
{id:13,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n4) ( ) A responsabilidade decorrente da violação de deveres éticos praticada por mais de um militar estadual que cause prejuízos materiais ao Estado é individual e não gera solidariedade entre os envolvidos.",a:[{t:"V) Verdadeiro",e:"Falso. É solidária."},{t:"F) Falso",c:1}],j:"O Art. 8º, § 5º do Decreto nº 5.075/1998 estabelece que a responsabilidade civil e administrativa pela participação de mais de um militar é solidária."},
{id:14,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n5) ( ) É assegurado ao militar estadual inativo e ao agregado, quando não convocados ou mobilizados, o direito de participar no meio civil de atividades político-partidárias, excetuados os assuntos de natureza militar de caráter sigiloso.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. É assegurado."}],j:"Previsão expressa do Art. 7º, § 6º do Anexo do Decreto nº 5.075/1998."},
{id:15,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n6) ( ) De acordo com o RDE (Decreto nº 4.346/2002), a punição de advertência é uma admoestação verbal que deve obrigatoriamente constar das alterações do punido e ser publicada em Boletim Interno.",a:[{t:"V) Verdadeiro",e:"Falso. Não consta."},{t:"F) Falso",c:1}],j:"O Art. 25, § 2º do RDE (Decreto nº 4.346/2002) específica que a advertência não constará das alterações do punido."},
{id:16,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n7) ( ) Para fins de classificação do comportamento militar das praças no RDE, a advertência e o impedimento disciplinar não são considerados para rebaixamento de comportamento.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Verdadeiro."}],j:"Conforme o Art. 51, § 5º do RDE, a advertência e o impedimento disciplinar não são considerados para fins de classificação de comportamento."},
{id:17,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n8) ( ) As praças da PMPR têm direito ao recebimento de uniformes de posse obrigatória por conta do orçamento do Estado, conforme previsto no Regulamento de Uniformes da PMPR.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Garantido."}],j:"Texto do Art. 216 da Lei nº 1.943/1954, com redação atualizada pela Lei Estadual nº 21.110/2022."},
{id:18,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n9) ( ) O Regulamento de Ética da PMPR permite ao militar invocar ordens de superiores ou situação de emergência pública para justificar a prática de atos de tortura ou tratamento cruel.",a:[{t:"V) Verdadeiro",e:"Falso. Proibido."},{t:"F) Falso",c:1}],j:"O Art. 13 do Decreto nº 5.075/1998 proíbe incisivamente a invocação de ordens superiores ou emergências para justificar tortura ou tratamento cruel."},
{id:19,en:"Analise o item abaixo e marque (V) para Verdadeiro ou (F) para Falso:\n\n10) ( ) A violação dos valores e dos deveres éticos dos militares estaduais será tanto mais grave quanto mais elevado for o grau hierárquico de quem a cometer.",a:[{t:"V) Verdadeiro",c:1},{t:"F) Falso",e:"Falso. Verdadeiro."}],j:"Texto literal do Art. 8º, § 2º do Anexo do Decreto nº 5.075/1998."}
];
let lQ=[],vM='',cI=0,r={},v={};
function iniciar(m){vM=m;const rnd=document.querySelector('input[name="ordem"]:checked').value==='rand';lQ=[...DB];if(rnd)lQ.sort(()=>Math.random()-.5);cI=0;r={};v={};document.getElementById('start-screen').style.display='none';document.getElementById('quiz-screen').style.display='block';document.getElementById('btn-voltar').style.display='inline-block';if(vM==='uma'){document.getElementById('nav-controls').style.display='flex';renderU()}else{document.getElementById('nav-controls').style.display='none';renderT()}}
function voltarInicio(e){if(e)e.preventDefault();document.getElementById('start-screen').style.display='block';document.getElementById('quiz-screen').style.display='none';document.getElementById('btn-voltar').style.display='none'}
function renderT(){const b=document.getElementById('quiz-content');b.innerHTML='';lQ.forEach((q,i)=>b.innerHTML+=`<div id="c-${q.id}">${getC(q,i)}</div>`)}
function renderU(){const b=document.getElementById('quiz-content');const q=lQ[cI];b.innerHTML=`<div id="c-${q.id}">${getC(q,cI)}</div>`;document.getElementById('btn-prev').disabled=cI===0;const bn=document.getElementById('btn-next');if(cI===lQ.length-1){bn.textContent="Finalizar";bn.onclick=()=>{alert("Simulado concluído!");voltarInicio()}}else{bn.textContent="Próxima →";bn.onclick=()=>{cI++;renderU();window.scrollTo(0,0)}}}
function upC(i){const q=lQ[i];const el=document.getElementById(`c-${q.id}`);if(el)el.innerHTML=getC(q,i)}
function getC(q,i){let h=`<div class="q-container"><div class="q-title">Questão ${q.id}</div><div class="q-text">${q.en}</div>`;const rs=r[q.id],ver=v[q.id]===true;q.a.forEach((alt,j)=>{let cls='alt';if(ver)cls+=' locked';if(ver){if(alt.c)cls+=' correct';else if(rs===j)cls+=' wrong'}else{if(rs===j)cls+=' sel'}h+=`<div class="${cls}" onclick="sel(${i},${j})">${alt.t}</div>`});if(!ver){h+=`<button class="btn-verify" ${rs!==undefined?'':'disabled'} onclick="verificar(${i})">Verificar Resposta</button>`}else{h+=`<button class="btn-verify checked" disabled>Resposta Verificada</button>`;h+=`<div class="feedback show ${q.a[rs].c?'ok':'no'}"><b>${q.a[rs].c?'✅ Você acertou!':'❌ Você errou.'}</b><div style="margin-bottom:8px"><strong>Justificativa:</strong> ${q.j}</div>`;q.a.forEach(alt=>{if(!alt.c&&alt.e)h+=`<div class="fb-alt"><em>Por que a alternativa ${alt.t.substring(0,2)} está errada:</em> <span>${alt.e}</span></div>`});h+=`</div>`}h+=`</div>`;return h}
function sel(i,j){const q=lQ[i];if(v[q.id])return;r[q.id]=j;upC(i)}
function verificar(i){const q=lQ[i];v[q.id]=true;upC(i)}
</script>
</body>
</html>
